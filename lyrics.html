<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌词</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css">

<style>
body{
    margin:0;
    background:#F8FAFC;
    font-family:"Pretendard",sans-serif;
}

.header{
    position:sticky;
    top:0;
    background:white;
    padding:18px;
    text-align:center;
    border-bottom:1px solid #E5E7EB;
}

.header h1{
    margin:0;
    color:#2563EB;
}

.back-btn{
    position:absolute;
    left:20px;
    top:16px;
    padding:8px 14px;
    border:none;
    border-radius:8px;
    background:#DBEAFE;
    color:#1D4ED8;
    cursor:pointer;
}

.content{
    max-width:900px;
    margin:30px auto;
    background:white;
    border-radius:12px;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    white-space:pre-wrap;
    line-height:2;
    font-size:20px;
}
</style>

</head>

<body>

<div class="header">

<button class="back-btn" onclick="history.back()">
← 뒤로
</button>

<h1 id="title">歌词</h1>

</div>

<div class="content" id="lyrics">
불러오는 중...
</div>

<script>

const params = new URLSearchParams(location.search);

const file = params.get("file");

document.getElementById("title").textContent =
file.replace(".txt","");

fetch(file)
.then(res=>res.text())
.then(text=>{
    document.getElementById("lyrics").textContent=text;
})
.catch(()=>{
    document.getElementById("lyrics").textContent="가사를 불러올 수 없습니다.";
});

</script>

</body>
</html>
